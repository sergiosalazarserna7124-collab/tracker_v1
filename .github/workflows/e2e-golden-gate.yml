name: e2e-golden-gate

# Guardián de Regresiones (AUT-1752)
# Corre la suite E2E golden cases contra el Cerebro de producción (demo cuenta 52).
# Falla el PR si algún caso golden se rompe.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# ─── Serialización global del gate (AUT-1783) ────────────────────────────────
# La suite golden corre contra infra COMPARTIDA y viva: la semilla del coach
# (guiones_coach con prefijo e2e_coach_% + coach_habilitado=true en demo cuenta 52)
# y su cleanup en after() operan sobre la MISMA cuenta 52 en todas las corridas.
# Si dos corridas del gate se solapan (dos PRs a la vez), el after() de una borra
# los guiones e inhabilita coach_habilitado mientras el before() de la otra sigue
# drenando → sus candidatos desaparecen → evaluaciones_coach nunca aterrizan y el
# subtest de coach falla intermitentemente (both-channels fail cuando hay solape,
# video-only cuando el race es parcial). Evidencia: runs 30044447776 (FAIL both) y
# 30044507557 (PASS) solapados 21:01–21:04 UTC el 2026-07-23 sobre cuenta 52.
# Un único group GLOBAL (sin keyear por ref/PR) fuerza que solo una corrida toque
# la cuenta 52 a la vez. cancel-in-progress=false → las demás encolan, no se cancela
# un gate ya corriendo (evita marcar rojo un gate legítimo a medio drenar).
concurrency:
  group: e2e-golden-gate-demo-52
  cancel-in-progress: false

jobs:
  golden-e2e:
    runs-on: ubuntu-latest
    # 10min: el seed del coach golden espera el procesamiento ASÍNCRONO de Fathom
    # con un poll acotado (deadline 150s, AUT-1775). En el peor caso —justo cuando
    # el race que arreglamos ocurre— el before() consume ~165s; con npm ci + tsc +
    # el resto de la suite, 5min quedaba demasiado justo y podía cortar por timeout.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run E2E golden cases
        env:
          VOZ_WEBHOOK_SECRET: ${{ secrets.VOZ_WEBHOOK_SECRET }}
          E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
        run: npm run test:e2e
